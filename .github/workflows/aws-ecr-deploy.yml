# Template: AWS ECR build + push para sa-east-1 (ARM64 single-arch).
#
# Como usar:
#   1. Copiar pra `.github/workflows/aws-ecr-deploy.yml` no repo do app.
#   2. Substituir `aja-agora` pelo nome canônico do app (kebab-case).
#      Ex.: sed -i 's/aja-agora/anfora-licitacoes/g' .github/workflows/aws-ecr-deploy.yml
#
# Pré-requisitos:
#   - ECR repos `twobrains/<app>/dev` e `twobrains/<app>/prod` criados (skill 00 passo 1)
#   - Secrets Manager `tb/dev/<app>/env` e `tb/prod/<app>/env` populados (skill 00 passo 4)
#   - IAM role `gha-ecs-deploy` confia no repo da org `twobrains-technology` (uma vez)
#
# Comportamento:
#   - main    → env=prod  → ECR twobrains/<app>/prod   (auto em push)
#   - develop → env=dev   → ECR twobrains/<app>/dev     (MANUAL — push NÃO deploya;
#               só valida migrations. Deploy do dev via workflow_dispatch env=dev.)
#   - workflow_dispatch → escolhe env (prod|dev) explicitamente
#
# Custo: o auto-deploy da develop a cada push (runner ARM + build + ECS) foi
# desligado em 2026-06-23 (Kairo) — develop deploya só sob demanda.

name: AWS ECR Deploy (sa-east-1, arm64)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      env:
        description: 'Target env (prod|dev)'
        type: choice
        options:
          - prod
          - dev
        default: dev

permissions:
  id-token: write
  contents: read
  pull-requests: write  # check-migration-pattern aplica label se destrutivo

env:
  AWS_REGION: sa-east-1
  ECR_ACCOUNT: "438465163995"
  APP: aja-agora

jobs:
  # Valida padrão de migrations (entrypoint, migrate runtime, pasta de migrations,
  # detecção de statements destrutivos). Falha o pipeline se faltar.
  #
  # Inlined a partir de tb-aws-platform/.github/workflows/check-migration-pattern.yml
  # (reusable workflow entre repos privados da org bloqueado por settings que
  # precisam de admin:org pra ajustar — ver tb-aws-platform/reference/conventions.md).
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verifica docker-entrypoint.sh
        run: |
          if [ ! -f docker-entrypoint.sh ]; then
            echo "::error::docker-entrypoint.sh ausente. Copie de tb-aws-platform/templates/docker-entrypoint.sh"
            exit 1
          fi
          if [ ! -x docker-entrypoint.sh ]; then
            echo "::error::docker-entrypoint.sh existe mas não é executável (chmod +x)"
            exit 1
          fi
      - name: Verifica ENTRYPOINT no Dockerfile
        run: |
          if ! grep -qE '^[[:space:]]*ENTRYPOINT[[:space:]]+\[.*docker-entrypoint\.sh' Dockerfile; then
            echo "::error::Dockerfile não declara ENTRYPOINT [\"/app/docker-entrypoint.sh\"]"
            exit 1
          fi
      - name: Verifica migrate runtime command
        run: |
          has_drizzle=$(jq -r '.scripts."db:migrate:runtime" // empty' package.json 2>/dev/null)
          has_prisma=0
          [ -f prisma/schema.prisma ] && has_prisma=1
          if [ -z "$has_drizzle" ] && [ "$has_prisma" = "0" ]; then
            echo "::error::Sem db:migrate:runtime no package.json E sem prisma/schema.prisma."
            exit 1
          fi
      - name: Verifica pasta de migrations
        run: |
          if [ -d drizzle ]; then
            count=$(find drizzle -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
            if [ "$count" = "0" ]; then
              echo "::warning::Pasta drizzle/ existe mas sem .sql"
            fi
          elif [ -d prisma/migrations ]; then
            :
          else
            echo "::error::Sem pasta de migrations (drizzle/ ou prisma/migrations/)"
            exit 1
          fi
      - name: Detecta statements destrutivos no diff (PR)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          base="${{ github.base_ref }}"
          git fetch origin "$base" --depth=1 || true
          changed=$(git diff --name-only "origin/$base"...HEAD -- '*.sql' || true)
          [ -z "$changed" ] && exit 0
          patterns='\b(DROP\s+TABLE|DROP\s+SCHEMA|DROP\s+DATABASE|TRUNCATE|ALTER\s+TABLE\s+\S+\s+DROP\s+(COLUMN|CONSTRAINT)|ALTER\s+TABLE\s+\S+\s+ALTER\s+COLUMN\s+\S+\s+(SET\s+DATA\s+)?TYPE)\b'
          findings=""
          for f in $changed; do
            [ -f "$f" ] || continue
            stripped=$(sed -E 's://.*$::g; s/--.*$//g' "$f")
            if echo "$stripped" | grep -iEq "$patterns"; then
              findings="$findings\n- $f"
            fi
          done
          if [ -n "$findings" ]; then
            gh pr edit $PR_NUMBER --add-label "migration:destructive" || true
            gh pr comment $PR_NUMBER --body "⚠️ **Migration destrutiva detectada:**${findings}\n\nExige aprovação de DBA/sênior. Em prod, deploy aborta sem \`ALLOW_DESTRUCTIVE_MIGRATION=true\` no secret \`tb/prod/<app>/env\`. Ver \`tb-aws-platform/reference/conventions.md → Migrations\`." || true
          fi

  # O agente em produção NÃO roda o prompt do repositório.
  #
  # `fetchManagedPrompt` lê a versão com label `production` do Langfuse e só usa a
  # constante do código como fallback. Editar `system-prompt.ts` /
  # `turn-analyzer.ts`, commitar e deployar não muda o agente enquanto ninguém
  # publicar — e ninguém era avisado. Em 2026-08-15 o `aja-turn-analyzer` estava
  # servindo a v1 de 07/08 enquanto o código, desde 14/08, já trazia os exemplos
  # que separam "200 por mês" de "200 mil".
  #
  # Roda SEMPRE (não só quando os arquivos mudam): a divergência também aparece
  # pelo outro lado, quando alguém edita o texto na UI do Langfuse — que muda o
  # agente em ≤60s, sem deploy e sem review.
  check-prompt-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ECR_ACCOUNT }}:role/gha-ecs-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Compara o prompt publicado com o do código
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "tb/prod/${{ env.APP }}/env" --query SecretString --output text)
          # As chaves entram só no ambiente deste step — nunca em arquivo, nunca no log.
          export LANGFUSE_BASE_URL=$(echo "$SECRET_JSON" | jq -r '.LANGFUSE_BASE_URL')
          export LANGFUSE_PUBLIC_KEY=$(echo "$SECRET_JSON" | jq -r '.LANGFUSE_PUBLIC_KEY')
          export LANGFUSE_SECRET_KEY=$(echo "$SECRET_JSON" | jq -r '.LANGFUSE_SECRET_KEY')
          export DATABASE_URL=$(echo "$SECRET_JSON" | jq -r '.DATABASE_URL')
          if ! pnpm prompts:check; then
            echo "::error::O prompt publicado em produção difere do código. Rode 'pnpm sync-prompts' apontado para a instância de produção — ou o agente seguirá rodando o texto antigo."
            exit 1
          fi

  build:
    needs: check-migrations
    # Deploy automático SÓ em push na main (prod) OU disparo manual (workflow_dispatch).
    # Push na develop NÃO builda/deploya — corte de custo (2026-06-23): develop deploya
    # só sob demanda via "Run workflow" (workflow_dispatch, env=dev). PR roda só check-migrations.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve env
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ inputs.env }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Compose image repo
        id: repo
        run: |
          echo "image_repo=${{ env.ECR_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/twobrains/${{ env.APP }}/${{ steps.vars.outputs.env }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ECR_ACCOUNT }}:role/gha-ecs-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch env from Secrets Manager and write .env files + build-args
        id: build_args
        run: |
          SECRET_ID="tb/${{ steps.vars.outputs.env }}/${{ env.APP }}/env"
          if ! SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text 2>/dev/null); then
            echo "::error::secret $SECRET_ID not found"
            exit 1
          fi
          # NÃO escrever .env* no contexto do build. NEXT_PUBLIC_* são bake-in via
          # build-args (passados como ENV no Dockerfile). Outras envs (DATABASE_URL etc)
          # vêm do ECS task definition em runtime via Secrets Manager.
          # Embutir .env* na imagem:
          #   1. Vaza secrets em camadas (qualquer um com pull no ECR vê)
          #   2. Trava o app aos valores de build-time — rotação de secret ou cutover de
          #      DB exige rebuild. Caso real: migração anfora 2026-05-01.
          # Detecta ARGs declarados no Dockerfile e gera build-args correspondentes
          DOCKERFILE="Dockerfile"
          mapfile -t arg_names < <(grep -E '^[[:space:]]*ARG[[:space:]]+' "$DOCKERFILE" 2>/dev/null | awk '{print $2}' | cut -d= -f1 | sort -u)
          {
            echo 'args<<EOF'
            for arg in "${arg_names[@]}"; do
              [ -z "$arg" ] && continue
              val=$(printf '%s' "$SECRET_JSON" | jq -r --arg k "$arg" '.[$k] // empty')
              [ -n "$val" ] && printf '%s=%s\n' "$arg" "$val"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: ${{ steps.build_args.outputs.args }}
          tags: |
            ${{ steps.repo.outputs.image_repo }}:latest
            ${{ steps.repo.outputs.image_repo }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=${{ steps.vars.outputs.env }}-arm64
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.env }}-arm64

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect "${{ steps.repo.outputs.image_repo }}:latest"

      - name: Force ECS service to pull new image
        run: |
          CLUSTER="tb-cluster"
          SERVICE="${{ env.APP }}-${{ steps.vars.outputs.env }}"
          echo "Forcing new deployment on cluster=$CLUSTER service=$SERVICE"
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" \
            --query 'service.deployments[0].{status:status,rolloutState:rolloutState,taskDefinition:taskDefinition}' \
            --output table

      # O WORKER roda a MESMA imagem do app (`prod:latest`), com outro command
      # (`node scripts/proposal-worker.bundle.cjs`). Como o passo acima força só
      # `<app>-<env>`, o serviço do worker continuava servindo a imagem antiga
      # depois de um deploy — e o que vive nele é justamente o que não tem
      # request para revelar a defasagem: re-engajamento, retomada, acolhida N1,
      # reconciliação e a campainha do SLA. Nenhum deles falha alto; eles
      # simplesmente continuam rodando a versão anterior, em silêncio.
      #
      # Descoberto em 31/08/2026, ao deployar a campainha do SLA (D3/E1): o
      # ciclo novo não chegaria a produção com o pipeline como estava.
      #
      # `|| true` de propósito: o serviço de worker existe só em prod. Em dev
      # não há `aja-agora-worker-dev`, e a ausência não pode falhar o deploy.
      - name: Force ECS worker service to pull new image
        run: |
          CLUSTER="tb-cluster"
          WORKER="${{ env.APP }}-worker-${{ steps.vars.outputs.env }}"
          if aws ecs describe-services --cluster "$CLUSTER" --services "$WORKER" \
               --region "${{ env.AWS_REGION }}" \
               --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "Forcing new deployment on worker=$WORKER"
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$WORKER" \
              --force-new-deployment \
              --region "${{ env.AWS_REGION }}" \
              --query 'service.deployments[0].{status:status,rolloutState:rolloutState}' \
              --output table
          else
            echo "Serviço $WORKER não existe neste ambiente — nada a fazer."
          fi

      - name: Wait ECS rollout completion
        run: |
          CLUSTER="tb-cluster"
          SERVICE="${{ env.APP }}-${{ steps.vars.outputs.env }}"
          REPO="twobrains/${{ env.APP }}/${{ steps.vars.outputs.env }}"
          TAG="sha-${{ steps.vars.outputs.sha_short }}"

          # ── O DEPLOY SÓ É VERDE SE A IMAGEM DESTE COMMIT ESTIVER RODANDO ──
          #
          # Ate 2026-07-30 este passo olhava so `rolloutState`, e isso mentia: quando
          # o circuit breaker do ECS derruba a task nova, ele faz ROLLBACK — o
          # deployment antigo volta a ser PRIMARY, com rolloutState=COMPLETED e
          # deployments=1. Ou seja, o padrao de "deu certo" e EXATAMENTE o mesmo de
          # "voltou pro que estava".
          #
          # Custo real do bug: prod ficou 8 dias servindo a imagem de 22/07 enquanto
          # todo deploy se reportava verde. As tasks novas morriam no migrate-guard,
          # o ECS revertia, e ninguem ficava sabendo. Descoberto so quando alguem foi
          # conferir a task na mao.
          #
          # A verificacao agora e por DIGEST da tag imutavel `sha-<commit>` — tag
          # `latest` nao serve de prova, porque ela e movel e aponta pra imagem nova
          # mesmo quando o ECS esta rodando a antiga.
          EXPECTED=$(aws ecr describe-images \
            --repository-name "$REPO" --image-ids imageTag="$TAG" \
            --region "${{ env.AWS_REGION }}" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "Esperado em execucao: $TAG -> $EXPECTED"

          echo "Waiting rollout to complete (timeout ~10min)..."
          # Polling em vez de wait services-stable (que pode demorar demais e nao reporta progresso)
          for i in $(seq 1 30); do
            state=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState' \
              --output text)
            count=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query 'services[0].deployments | length(@)' \
              --output text)
            echo "[$i/30] PRIMARY rolloutState=$state deployments=$count"
            # O ROLLBACK APARECE NOS EVENTOS, E SÓ ALI.
            #
            # `ecs:ListTasks`/`DescribeTasks` seriam a prova mais direta (comparar o
            # digest em execucao com o esperado), mas a role `gha-ecs-deploy` NAO tem
            # essas permissoes — tentar isso quebrou o deploy 3abb5c3 com
            # AccessDeniedException DEPOIS de a imagem ja ter subido. Os eventos vem
            # no mesmo `describe-services` que o loop ja chama, sem IAM novo.
            rollback=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query 'services[0].events[0:12].message' --output text \
              | grep -c -i "rolling back\|deployment failed" || true)
            if [ "$rollback" != "0" ]; then
              echo "::error::DEPLOY REVERTIDO — o ECS derrubou a task nova e voltou pra anterior."
              echo "::error::esperado em execucao: $TAG ($EXPECTED)"
              echo "Cheque por que a task nova morreu (log group /ecs/tb/${{ steps.vars.outputs.env }}):"
              echo "  causa mais comum: migration destrutiva pendente barrada pelo migrate-guard."
              aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --region "${{ env.AWS_REGION }}" \
                --query 'services[0].events[0:6].[createdAt,message]' --output text
              exit 1
            fi
            if [ "$state" = "COMPLETED" ] && [ "$count" = "1" ]; then
              echo "Rollout completed — sem rollback nos eventos; esperado $TAG ($EXPECTED)."
              exit 0
            fi
            if [ "$state" = "FAILED" ]; then
              echo "::error::ECS rollout FAILED"
              exit 1
            fi
            sleep 20
          done
          echo "::error::Rollout did not complete within ~10min"
          exit 1
