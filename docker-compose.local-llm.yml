# Override que roda o app contra o gateway de LLM local COMPARTILHADO
# (`tb-litellm-shared`, em `~/.tb-local/_shared/`), em vez do gateway da VPC
# atrás do túnel SSM.
#
#   cd ~/.tb-local/_shared && docker compose -f docker-compose.litellm.yml \
#     --env-file .env.shared.litellm up -d
#   docker compose -f docker-compose.yml -f docker-compose.local-llm.yml \
#     --profile containerized up -d app
#
# Voltar pro Sonnet via VPC: subir o app SEM este arquivo (o `.env.local` volta
# a mandar) e reabrir o túnel na 4100. Alternativa sem túnel: manter este
# override e trocar `AI_MODEL` pra `claude-sonnet-5`, que o gateway
# compartilhado também serve.
#
# É um override versionado de propósito — a alternativa seria editar
# `.env.local`, que não é versionado e vive na máquina de uma pessoa só. Assim
# a troca de modelo é reproduzível por quem for.
services:
  app:
    environment:
      LITELLM_BASE_URL: http://tb-litellm-shared:4000
      LITELLM_API_KEY: sk-local-dev
      AI_MODEL: qwen-local
      # DIVISÃO DE TRABALHO, achada rodando a jornada de verdade: a CONVERSA
      # fica no modelo local (é o que gasta volume), mas a EXTRAÇÃO vai pro
      # Haiku real. Com o analyzer no 4B, "quero um carro de uns 90 mil" não
      # virava `creditMax` e o funil ficava preso no gate `credit` — o agente
      # conversava bem e a jornada não andava.
      #
      # Pra rodar 100% local (sem chave, sem custo): trocar por `qwen-local`,
      # aceitando que a extração falha e o funil trava.
      AI_ANALYZER_MODEL: claude-haiku-4-5
